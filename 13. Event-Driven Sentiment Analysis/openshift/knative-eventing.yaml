# Requires already-installed OpenShift Serverless Eventing AND KafkaSource components.
# The CloudEvents emitted by KafkaSource are typically type dev.knative.kafka.event.
# Data contains the original Kafka message, a structured CloudEvent review.
apiVersion: eventing.knative.dev/v1
kind: Broker
metadata:
  name: m13-reviews-broker
  labels: {training: module13}
---
apiVersion: sources.knative.dev/v1
kind: KafkaSource
metadata:
  name: m13-globex-kafka-source
  labels: {training: module13}
spec:
  consumerGroup: m13-knative-source
  initialOffset: earliest
  bootstrapServers:
    - KAFKA_BOOTSTRAP_PLACEHOLDER
  topics:
    - globex.reviews
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: m13-reviews-broker
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: m13-moderation-trigger
  labels: {training: module13}
spec:
  broker: m13-reviews-broker
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: m13-globex-reviews
    uri: /events/moderation
---
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: m13-sentiment-trigger
  labels: {training: module13}
spec:
  broker: m13-reviews-broker
  subscriber:
    ref:
      apiVersion: v1
      kind: Service
      name: m13-globex-reviews
    uri: /events/sentiment
