name: Bootstrap Module 09 committed npm lockfile (temporary)
on:
  push:
    branches:
      - fix/self-contained-course-2026-no-external-image-changes
    paths:
      - .github/workflows/m09-lock-bootstrap.yml
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and verify exact package dependencies
        working-directory: 09. OpenShift/labs/examples/quotes-stack/frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Commit lockfile to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '09. OpenShift/labs/examples/quotes-stack/frontend/package-lock.json'
          if ! git diff --cached --quiet; then
            git commit -m "build(module 09): commit resolved React SSR npm lockfile"
            git push origin "HEAD:fix/self-contained-course-2026-no-external-image-changes"
          fi
