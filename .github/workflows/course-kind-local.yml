name: Disposable Kubernetes 1.37 kind lab

on:
  pull_request:
    paths:
      - 'lab-environments/kind/**'
      - 'README.md'
      - '02. Cluster Setup and Management/README.md'
      - '.github/workflows/course-kind-local.yml'
  push:
    branches:
      - main
      - feat/reproducible-kind-local-kubernetes-137-lab
    paths:
      - 'lab-environments/kind/**'
      - '.github/workflows/course-kind-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Verify IaC manifests, shell lifecycle and local links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Check syntax and version/CNI/port invariants
        run: |
          bash -n lab-environments/kind/scripts/lab.sh
          make -C lab-environments/kind -n up
          make -C lab-environments/kind -n down
          python3 - <<'PY'
          import pathlib, yaml
          root=pathlib.Path('lab-environments/kind')
          cfg=yaml.safe_load((root/'kind-config.yaml').read_text())
          cal=yaml.safe_load((root/'calico-installation.yaml').read_text())
          assert cfg['apiVersion']=='kind.x-k8s.io/v1alpha4'
          assert cfg['name']=='course-lab'
          assert [n['role'] for n in cfg['nodes']]==['control-plane','worker','worker']
          assert all(n['image'].startswith('kindest/node:v1.37.0@sha256:') for n in cfg['nodes'])
          assert len(set(n['image'] for n in cfg['nodes']))==1
          assert cfg['networking']['disableDefaultCNI'] is True
          assert cfg['networking']['apiServerAddress']=='127.0.0.1'
          assert cal['spec']['calicoNetwork']['bgp']=='Disabled'
          pool=cal['spec']['calicoNetwork']['ipPools'][0]
          assert pool['encapsulation']=='VXLAN'
          assert pool['cidr']==cfg['networking']['podSubnet']=='10.244.0.0/16'
          published=cfg['nodes'][0]['extraPortMappings']
          assert all(p['listenAddress']=='127.0.0.1' for p in published)
          assert set([30001,31000,32000,32001,32002,30080,30443])==set(p['containerPort'] for p in published)
          assert len({p['hostPort'] for p in published})==len(published)
          print('PASS: pinned 1.37/Calico VXLAN cluster, three nodes and safe loopback mapping')
          PY

  live-kind:
    name: Boot, verify and destroy actual three-node Kubernetes/Calico cluster
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned kind 0.33.0 and kubectl 1.37.0
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
          docker info
      - name: Create and verify actual Kubernetes cluster with Calico
        run: |
          make -C lab-environments/kind up
          make -C lab-environments/kind verify
          docker ps --filter name=course-lab
          kubectl --context kind-course-lab get nodes -o wide
          kubectl --context kind-course-lab get pods -A
      - name: Export node and CNI logs if failed
        if: failure()
        run: |
          kind export logs --name course-lab --output /tmp/kind-cluster-logs || true
          kubectl --context kind-course-lab get pods -A || true
          kubectl --context kind-course-lab -n tigera-operator logs deployment/tigera-operator --tail=100 || true
      - name: Remove only the test cluster
        if: always()
        run: make -C lab-environments/kind down
