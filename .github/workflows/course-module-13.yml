name: Course module 13 local verification

on:
  pull_request:
    paths:
      - "13. API Management and Service Mesh/**"
      - ".github/workflows/course-module-13.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  travelz-local:
    name: Module 13 C# Travelz, partner APIM and canary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full local acceptance suite
        shell: bash
        run: bash "13. API Management and Service Mesh/scripts/verify-local.sh"
