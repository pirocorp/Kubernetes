# Replace HOST_PLACEHOLDER with host generated for route-v1.
# Both Routes MUST be in the SAME namespace for strict host ownership.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: m12-order-v2
  labels: {training: module12}
spec:
  host: HOST_PLACEHOLDER
  path: /v2
  to: {kind: Service, name: m12-order-v2, weight: 100}
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
