              name: "APP_MODE"
              value: "portal"
            -
              name: "ASPNETCORE_URLS"
              value: "http://+:8080"
            -
              name: "AGENCY_URL"
              value: "http://m12-agency-v1:8080"
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: "http"
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
