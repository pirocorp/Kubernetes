---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "m12-partner"
  labels:
    training: "module12"
spec:
  type: "ClusterIP"
  selector:
    app: "m12-partner"
  ports:
    -
      name: "http"
      port: 8080
      targetPort: "http"
---
apiVersion: "route.openshift.io/v1"
kind: "Route"
metadata:
  name: "m12-partner"
  labels:
    training: "module12"
spec:
  to:
    kind: "Service"
    name: "m12-partner"
  port:
    targetPort: "http"
  tls:
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"
