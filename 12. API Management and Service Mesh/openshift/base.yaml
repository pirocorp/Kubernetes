# OpenShift base resources for Module 12 — JSON-derived, standard readable YAML.
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "m12-agency-sa"
  labels:
    training: "module12"
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "m12-portal-sa"
  labels:
    training: "module12"
---
apiVersion: "v1"
kind: "ServiceAccount"
metadata:
  name: "m12-partner-sa"
  labels:
    training: "module12"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "m12-agency-v1"
  labels:
    training: "module12"
    app: "m12-agency"
    version: "v1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "m12-agency"
      version: "v1"
  template:
    metadata:
      labels:
        app: "m12-agency"
        version: "v1"
        training: "module12"
    spec:
      serviceAccountName: "m12-agency-sa"
      containers:
        -
          name: "app"
          image: "TRAVEL_IMAGE_PLACEHOLDER"
          imagePullPolicy: "Always"
          ports:
            -
              name: "http"
              containerPort: 8080
          env:
            -
              name: "APP_MODE"
              value: "agency-v1"
            -
              name: "ASPNETCORE_URLS"
              value: "http://+:8080"
          readinessProbe:
            httpGet:
              path: "/healthz"
              port: "http"
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: "/healthz"
              port: "http"
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
            runAsNonRoot: true
            seccompProfile:
              type: "RuntimeDefault"
---
