# Apply only after EVERY relevant workload shows an injected Istio proxy.
# This targets ONLY Travelz agency pods, not the whole namespace.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: m12-agency-strict
  labels: {training: module12}
spec:
  selector:
    matchLabels: {app: m12-agency}
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: m12-agency-allow-clients
  labels: {training: module12}
spec:
  selector:
    matchLabels: {app: m12-agency}
  action: ALLOW
  rules:
    - from:
        - source:
            # No namespace prefix => local namespace, Istio's serviceAccounts syntax.
            serviceAccounts: [m12-portal-sa, m12-partner-sa]
      to:
        - operation:
            methods: [GET]
            paths: ["/api/travels/*"]
