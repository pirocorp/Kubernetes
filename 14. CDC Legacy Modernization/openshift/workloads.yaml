# Module 14 namespace-only workloads; no Operators, Kafka clusters, databases or Elasticsearch installed here.
# Replace IMAGE_PLACEHOLDER with the local project's OpenShift ImageStream digest/tag.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: m14-legacy-sa
  labels: {training: module14}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: m14-modern-sa
  labels: {training: module14}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m14-legacy
  labels: {app: m14-legacy, training: module14}
spec:
  replicas: 1
  selector: {matchLabels: {app: m14-legacy}}
  template:
    metadata:
      labels: {app: m14-legacy, training: module14}
    spec:
      serviceAccountName: m14-legacy-sa
      automountServiceAccountToken: false
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_MODE, value: "legacy"}
            - {name: ASPNETCORE_URLS, value: "http://+:8080"}
            - name: LEGACY_CONNECTION
              valueFrom: {secretKeyRef: {name: m14-legacy-conn, key: LEGACY_CONNECTION}}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            initialDelaySeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m14-modern
  labels: {app: m14-modern, training: module14}
spec:
  replicas: 1
  selector: {matchLabels: {app: m14-modern}}
  template:
    metadata:
      labels: {app: m14-modern, training: module14}
    spec:
      serviceAccountName: m14-modern-sa
      automountServiceAccountToken: false
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: APP_MODE, value: "modern"}
            - {name: ASPNETCORE_URLS, value: "http://+:8080"}
            - {name: KAFKA_GROUP_ID, value: "m14-projections"}
            - name: KAFKA_BOOTSTRAP
              valueFrom: {secretKeyRef: {name: m14-modern-conn, key: KAFKA_BOOTSTRAP}}
            - name: CASHBACK_CONNECTION
              valueFrom: {secretKeyRef: {name: m14-modern-conn, key: CASHBACK_CONNECTION}}
            - name: SEARCH_URL
              valueFrom: {secretKeyRef: {name: m14-modern-conn, key: SEARCH_URL}}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            initialDelaySeconds: 15
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: m14-legacy
  labels: {training: module14}
spec:
  type: ClusterIP
  selector: {app: m14-legacy}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: m14-modern
  labels: {training: module14}
spec:
  type: ClusterIP
  selector: {app: m14-modern}
  ports: [{name: http, port: 8080, targetPort: http}]
