apiVersion: batch/v1
kind: CronJob
metadata:
  name: pulse
  namespace: exam-venus
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: reporter
            image: busybox:1.36
            command: ["/bin/sh", "-c"]
            args: ["echo exam-venus-pulse; date -u"]
