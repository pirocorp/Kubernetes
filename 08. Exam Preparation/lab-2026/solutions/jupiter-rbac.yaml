apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: exam-jupiter
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-pods
  namespace: exam-jupiter
subjects:
- kind: ServiceAccount
  name: exam-reader
  namespace: exam-jupiter
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
