apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: exam-mars
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
      - name: main
        image: nginx:1.30.6-alpine-slim
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portal-svc
  namespace: exam-mars
spec:
  selector:
    app: portal
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31200
    protocol: TCP
