# NOTE (2026): Versioned images keep the original two-init-container
# timestamp exercise reproducible on Kubernetes 1.37.
apiVersion: v1
kind: Pod
metadata:
  name: pod-init
  labels:
    app: pod-init
spec:
  containers:
  - name: cont-main
    image: nginx:1.30.6-alpine-slim
    ports:
    - containerPort: 80
    volumeMounts:
    - name: data
      mountPath: /usr/share/nginx/html
  initContainers:
  - name: cont-init-0
    image: alpine:3.22
    command: ["/bin/sh", "-c"]
    args:
      - echo $(date +'%Y-%m-%d %H:%M:%S') begin initialization ... '<br />' >> /data/index.html;
        sleep 10;
        echo $(date +'%Y-%m-%d %H:%M:%S') ... done '<br />' >> /data/index.html;
    volumeMounts:
    - name: data
      mountPath: /data      
  - name: cont-init-1
    image: alpine:3.22
    command: ["/bin/sh", "-c"]
    args:
      - echo $(date +'%Y-%m-%d %H:%M:%S') launching the application ... '<br />' >> /data/index.html;
    volumeMounts:
    - name: data
      mountPath: /data
  volumes:
  - name: data
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: svc-init
  labels:
    app: svc-init
spec:
  type: NodePort
  ports:
  - port: 80
    nodePort: 30001
    protocol: TCP
  selector:
    app: pod-init