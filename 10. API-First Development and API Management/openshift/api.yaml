# Replace IMAGE_PLACEHOLDER with the built ImageStream Docker reference before apply.
# Select the personal Sandbox Project with 'oc project ...' first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m10-products-api
  labels:
    app: m10-products-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m10-products-api
  template:
    metadata:
      labels:
        app: m10-products-api
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: m10-products-key
                  key: API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: m10-products-api
  labels:
    app: m10-products-api
spec:
  selector:
    app: m10-products-api
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: m10-products-api
  labels:
    app: m10-products-api
spec:
  to:
    kind: Service
    name: m10-products-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
