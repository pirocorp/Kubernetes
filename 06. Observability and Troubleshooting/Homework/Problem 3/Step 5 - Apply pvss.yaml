# NOTE (2026): Recycle -> Retain (Recycle е остаряла/deprecated политика).
# Преди (Recycle): автоматично изчистване на данните; PV може да се използва отново.
# Сега (Retain): данните остават; при изтриване на PVC, PV става Released.
# Запазваме данните, но повторното използване на PV изисква ръчно управление.
# Важно: Retain влиза в действие едва когато съответният PVC бъде изтрит.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvssa
  labels:
    purpose: ssdemo
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - nfsvers=4.1
  nfs:
    path: /data/nfs/k8spva
    server: nfs-server
---
