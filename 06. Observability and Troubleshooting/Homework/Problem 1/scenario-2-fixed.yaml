# NOTE (2026): Corrected outcome of the intentionally broken scenario-2.yaml.
# The sidecar creates healthy.html after 20s; readiness then becomes true.
apiVersion: v1
kind: Pod
metadata:
  name: readiness-http
  labels:
    app: readiness-http
spec:
  initContainers:
  - name: init-data
    image: alpine:3.22
    command: ["/bin/sh", "-c"]
    args:
    - "echo '(Almost) Always Ready to Serve ;)' > /data/index.html"
    volumeMounts:
    - name: data
      mountPath: /data
  containers:
  - name: cont-main
    image: nginx:1.30.6-alpine-slim
    volumeMounts:
    - name: data
      mountPath: /usr/share/nginx/html
    readinessProbe:
      httpGet:
        path: /healthy.html
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
  - name: cont-sidecar-postpone
    image: alpine:3.22
    command: ["/bin/sh", "-ec"]
    args:
    - |
      while true; do
        sleep 20
        echo 'WORKING' > /check/healthy.html
        sleep 60
      done
    volumeMounts:
    - name: data
      mountPath: /check
  volumes:
  - name: data
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-http
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001
    protocol: TCP
  selector:
    app: readiness-http
