# NOTE (2026): Allow time for the 20s sidecar delay before failing startupProbe.
# Use a fresh lab: this and scenario 2 both need NodePort 30001.
apiVersion: v1
kind: Pod
metadata:
  name: startup-mixed
  labels:
    app: startup-mixed
spec:
  initContainers:
  - name: init-data
    image: alpine:3.22
    command: ["/bin/sh", "-c"]
    args:
    - "echo '(Almost) Always Ready to Serve ;)' > /data/index.html"
    volumeMounts:
    - name: data
      mountPath: /data
  containers:
  - name: cont-main
    image: nginx:1.30.6-alpine-slim
    volumeMounts:
    - name: data
      mountPath: /usr/share/nginx/html
    livenessProbe:
      httpGet:
        path: /healthy.html
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
    startupProbe:
      exec:
        command: ["cat", "/usr/share/nginx/html/healthy.html"]
      failureThreshold: 10
      periodSeconds: 5
  - name: cont-sidecar-postpone
    image: alpine:3.22
    command: ["/bin/sh", "-ec"]
    args:
    - |
      while true; do
        sleep 20
        echo 'WORKING' > /check/healthy.html
        sleep 60
      done
    volumeMounts:
    - name: data
      mountPath: /check
  volumes:
  - name: data
    emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: startup-mixed
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30001
    protocol: TCP
  selector:
    app: startup-mixed
