apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: m13-agency
  labels: {training: module13}
spec:
  hosts: [m13-agency]
  gateways: [mesh]
  http:
    - timeout: 4s
      route:
        - destination:
            host: m13-agency
            subset: v1
            port: {number: 8080}
          weight: 100
