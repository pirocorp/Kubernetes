apiVersion: v1
kind: Service
metadata:
  name: m10-postgres
  labels:
    app: m10-postgres
spec:
  type: ClusterIP
  selector:
    app: m10-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m10-postgres
  labels:
    app: m10-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: m10-postgres
  template:
    metadata:
      labels:
        app: m10-postgres
        name: m10-postgres
    spec:
      containers:
        - name: postgres
          # OpenShift-compatible image, does not require cluster-admin privileges.
          image: quay.io/sclorg/postgresql-16-c9s:20250214
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: m10-postgres-auth
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: m10-postgres-auth
                  key: POSTGRESQL_DATABASE
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: m10-postgres-auth
                  key: POSTGRESQL_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/pgsql/data
          startupProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "pg_isready -U \"$POSTGRESQL_USER\" -d \"$POSTGRESQL_DATABASE\""]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
      volumes:
        - name: pgdata
          emptyDir: {}
