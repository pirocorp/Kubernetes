name: m10-shorties
services:
  database:
    image: postgres:17.6
    environment:
      POSTGRES_USER: shorties
      POSTGRES_PASSWORD: ${M10_DB_PASSWORD:?Run python3 tools/init_env.py}
      POSTGRES_DB: shorties
    ports: ["127.0.0.1:5439:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorties -d shorties"]
      interval: 5s
      timeout: 3s
      retries: 25
    networks: [app]
  backend:
    build: ./src/backend
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://shorties:${M10_DB_PASSWORD}@database:5432/shorties"
    ports: ["127.0.0.1:3111:8080"]
    depends_on:
      database: {condition: service_healthy}
    networks: [app]
  redirector:
    build: ./src/redirector
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://shorties:${M10_DB_PASSWORD}@database:5432/shorties"
    ports: ["127.0.0.1:3112:8080"]
    depends_on:
      database: {condition: service_healthy}
    networks: [app]
  frontend:
    build: ./src/frontend
    environment:
      PORT: "8080"
      BACKEND_URL: "http://backend:8080"
      REDIRECTOR_URL: "http://redirector:8080"
    ports: ["127.0.0.1:3110:8080"]
    depends_on: [backend,redirector]
    networks: [app]
networks:
  app: {}
volumes:
  pgdata: {}
