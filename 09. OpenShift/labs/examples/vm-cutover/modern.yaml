apiVersion: v1
kind: ConfigMap
metadata:
  name: m09-modern-html
  labels:
    lab: module09virt
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head><meta charset="utf-8"><title>Module 09 Modern</title></head>
    <body><h1>Modern container - OpenShift Module 09</h1></body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m09-modern
  labels:
    lab: module09virt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: m09-modern
  template:
    metadata:
      labels:
        app: m09-modern
        lab: module09virt
    spec:
      containers:
        - name: httpd
          image: registry.access.redhat.com/ubi9/httpd-24:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: page
              mountPath: /var/www/html/index.html
              subPath: index.html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: page
          configMap:
            name: m09-modern-html
---
apiVersion: v1
kind: Service
metadata:
  name: m09-modern
  labels:
    lab: module09virt
spec:
  type: ClusterIP
  selector:
    app: m09-modern
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
