apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: m09-db-data
  labels: {lab: module09c}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: m09-db
  labels: {lab: module09c}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: m09-db}
  template:
    metadata:
      labels: {app: m09-db, lab: module09c}
    spec:
      containers:
      - name: mariadb
        image: quay.io/sclorg/mariadb-1011-c9s:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MYSQL_USER
          valueFrom: {secretKeyRef: {name: m09-db-creds, key: MYSQL_USER}}
        - name: MYSQL_PASSWORD
          valueFrom: {secretKeyRef: {name: m09-db-creds, key: MYSQL_PASSWORD}}
        - name: MYSQL_DATABASE
          valueFrom: {secretKeyRef: {name: m09-db-creds, key: MYSQL_DATABASE}}
        ports:
        - {name: mysql, containerPort: 3306}
        volumeMounts:
        - {name: data, mountPath: /var/lib/mysql/data}
        startupProbe:
          tcpSocket: {port: mysql}
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          tcpSocket: {port: mysql}
          periodSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 750m, memory: 1Gi}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: m09-db-data}
---
apiVersion: v1
kind: Service
metadata:
  name: m09-db
  labels: {lab: module09c}
spec:
  selector: {app: m09-db}
  type: ClusterIP
  ports:
    - {name: mysql, port: 3306, targetPort: mysql}
